name: Compiler X32 Système PC

on:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  push:
    tags: ["v*"]            # un tag v0.2.0 publie l'ISO + la mise à jour dans « Releases »

permissions:
  contents: write

jobs:
  # 1) Paquet de mise à jour (rapide) : ce que x32-update installe sur un système existant
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fabriquer et signer le paquet de mise à jour
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
            chmod 600 "$RUNNER_TEMP/key.pem"
            X32_SIGNING_KEY="$RUNNER_TEMP/key.pem" tools/make-update.sh
            rm -f "$RUNNER_TEMP/key.pem"
          else
            echo "::warning::Secret UPDATE_SIGNING_KEY absent : paquet NON signé (x32-update le refusera). Voir README."
            tools/make-update.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: x32-update
          path: out/x32-update-*
          retention-days: 14

      - name: Publier dans Releases (si tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/x32-update-*

  # 2) ISO installable
  iso:
    needs: update
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de la place disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools wget util-linux coreutils python3 file

      - name: Compiler l'ISO
        run: sudo ./build.sh

      - name: Envoyer l'ISO (artefact, 7 jours)
        uses: actions/upload-artifact@v4
        with:
          name: x32-systeme-pc-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 7
          compression-level: 0

      - name: Publier dans Releases (si tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/*.sha256
