# X32 Système PC : réglages mémoire / CPU pour Atom N-series + 1 à 2 Go de RAM

# Avec zram (swap compressé en RAM, prioritaire), swapper tôt est moins coûteux
# que vider le cache disque. page-cluster=0 : pas de lecture anticipée de swap.
vm.swappiness = 80
vm.page-cluster = 0

# Garde plus longtemps le cache des dossiers/fichiers (disque lent)
vm.vfs_cache_pressure = 50

# Écritures disque plus régulières, moins de pics qui figent le système
vm.dirty_background_ratio = 5
vm.dirty_ratio = 20

# Pas de watchdog NMI : moins de réveils du processeur
kernel.nmi_watchdog = 0
